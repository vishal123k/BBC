<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" fill="none">
  <defs>
    <radialGradient id="workshopGlow" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#182247" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#090d1f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050711" stop-opacity="0.98"/>
    </radialGradient>
    <pattern id="hexPattern" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 0 57.735 L 0 80.829 L 20 92.376 L 40 80.829 L 40 57.735 L 20 46.188 Z" fill="none" stroke="#1e294f" stroke-width="0.8" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="1440" height="600" fill="#060914"/>
  <!-- Automotive garage floor hex grid / workshop texture -->
  <rect width="1440" height="600" fill="url(#hexPattern)"/>
  
  <!-- Subtle silhouette of garage lift beams and tools in background -->
  <g stroke="#1a2342" stroke-width="2" opacity="0.3">
    <!-- Garage Lift posts -->
    <line x1="120" y1="100" x2="120" y2="600"/>
    <line x1="150" y1="100" x2="150" y2="600"/>
    <line x1="120" y1="220" x2="150" y2="220"/>
    <line x1="120" y1="380" x2="150" y2="380"/>

    <line x1="1290" y1="100" x2="1290" y2="600"/>
    <line x1="1320" y1="100" x2="1320" y2="600"/>
    <line x1="1290" y1="220" x2="1320" y2="220"/>
    <line x1="1290" y1="380" x2="1320" y2="380"/>
  </g>

  <!-- Atmospheric Dark Gradient Overlay -->
  <rect width="1440" height="600" fill="url(#workshopGlow)"/>
</svg>
