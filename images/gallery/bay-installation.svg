<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" fill="none">
  <rect width="500" height="320" fill="#090d20"/>
  <!-- Garage Bay with Starlight Headliner on workbench -->
  <rect x="30" y="30" width="440" height="260" rx="8" fill="#111736" stroke="#1f294f"/>
  <rect x="60" y="160" width="380" height="100" rx="6" fill="#080b18" stroke="#c9a13d" stroke-width="2"/>
  <!-- Starlight dots on bench -->
  <g fill="#ffffff">
    <circle cx="100" cy="190" r="1.5"/>
    <circle cx="150" cy="220" r="2.5" fill="#c9a13d"/>
    <circle cx="200" cy="180" r="1.8"/>
    <circle cx="260" cy="230" r="2"/>
    <circle cx="320" cy="190" r="2.5" fill="#c9a13d"/>
    <circle cx="380" cy="210" r="1.5"/>
    <circle cx="120" cy="240" r="2"/>
    <circle cx="290" cy="205" r="1.5"/>
  </g>
  <!-- Technician hands / tool silhouette -->
  <line x1="240" y1="120" x2="260" y2="180" stroke="#c9a13d" stroke-width="4" stroke-linecap="round"/>
  <circle cx="260" cy="180" r="8" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <text x="250" y="90" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">STARLIGHT CEILING BENCH</text>
  <text x="250" y="115" font-family="'Outfit', sans-serif" font-size="11" fill="#c9a13d" text-anchor="middle">PRECISION FIBER DRILLING • WESTWOOD MALL</text>
</svg>
