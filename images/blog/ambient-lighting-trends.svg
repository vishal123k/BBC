  <!-- Multi-color glowing soundwaves / LED bars -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="140" y1="180" x2="140" y2="120" stroke="#f43f5e"/>
    <line x1="170" y1="200" x2="170" y2="100" stroke="#fb923c"/>
