  <text x="300" y="290" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">NEXT-GEN CABIN LIGHTING TRENDS</text>
  <text x="300" y="315" font-family="'Outfit', sans-serif" font-size="12" font-weight="600" fill="#c9a13d" text-anchor="middle" letter-spacing="1">SYMPHONY FLOWS & HIDDEN FIBERS</text>
