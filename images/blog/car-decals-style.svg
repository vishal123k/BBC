<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="decal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18"/>
      <stop offset="60%" stop-color="#0f1638"/>
      <stop offset="100%" stop-color="#19234d"/>
    </linearGradient>
    <linearGradient id="gold-stroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#c9a13d"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#decal-bg)"/>

  <!-- Geometric Grid & Decal Cutlines -->
  <g stroke="#222d54" stroke-width="1.5" opacity="0.6">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Stylized Sports Car Side Profile with Decal Graphics -->
  <g transform="translate(100, 140)">
    <!-- Car Body Silhouette -->
    <path d="M40 180 L80 120 L200 90 L340 90 L440 130 L560 145 L580 180 Z" fill="#0b1026" stroke="#3b4a78" stroke-width="3"/>
    
    <!-- Cabin Glass -->
    <path d="M190 95 L330 95 L400 130 L230 130 Z" fill="#131c3f" stroke="#c9a13d" stroke-width="1.5"/>

    <!-- High-impact Dynamic Racing Decal Stripes -->
    <path d="M60 170 L260 130 L320 130 L120 170 Z" fill="url(#gold-stroke)" opacity="0.9"/>
    <path d="M140 170 L340 130 L400 130 L200 170 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M220 170 L420 130 L460 130 L260 170 Z" fill="#eab308" opacity="0.8"/>

    <!-- Honeycomb Decal Pattern on Rear Quarter -->
    <polygon points="460,140 475,130 490,140 490,155 475,165 460,155" fill="none" stroke="#c9a13d" stroke-width="2"/>
    <polygon points="495,140 510,130 525,140 525,155 510,165 495,155" fill="none" stroke="#c9a13d" stroke-width="2"/>
    <polygon points="478,165 493,155 508,165 508,180 493,190 478,180" fill="none" stroke="#c9a13d" stroke-width="2"/>

    <!-- Wheels -->
    <circle cx="140" cy="180" r="42" fill="#060914" stroke="#c9a13d" stroke-width="4"/>
    <circle cx="140" cy="180" r="24" fill="#141a33" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="480" cy="180" r="42" fill="#060914" stroke="#c9a13d" stroke-width="4"/>
    <circle cx="480" cy="180" r="24" fill="#141a33" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Badge / Watermark -->
  <rect x="40" y="40" width="180" height="34" rx="6" fill="#0a0f24" stroke="#c9a13d" stroke-width="1.5"/>
  <text x="130" y="62" font-family="'Barlow Condensed', sans-serif" font-size="14" font-weight="800" fill="#c9a13d" text-anchor="middle" letter-spacing="2">CUSTOM VINYL & DECALS</text>
  
  <text x="400" y="435" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">EXPRESS YOUR PASSION & STYLE</text>
</svg>
