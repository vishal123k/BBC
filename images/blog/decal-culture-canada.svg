<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" fill="none">
  <defs>
    <linearGradient id="canada-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c1c"/>
      <stop offset="60%" stop-color="#12183b"/>
      <stop offset="100%" stop-color="#1f2652"/>
    </linearGradient>
    <linearGradient id="red-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#canada-bg)"/>

  <!-- Stylized Canadian Maple Leaf in Automotive Mesh -->
  <g transform="translate(400, 220) scale(1.1)" opacity="0.25">
    <path d="M0 -120 L25 -70 L60 -80 L40 -40 L90 -30 L70 10 L110 30 L80 60 L10 50 L10 100 L-10 100 L-10 50 L-80 60 L-110 30 L-70 10 L-90 -30 L-40 -40 L-60 -80 L-25 -70 Z" fill="#ef4444"/>
  </g>

  <!-- Truck / Car Culture Graphic Silhouette -->
  <g transform="translate(140, 160)">
    <!-- Semi-truck & tuner car meeting -->
    <path d="M40 180 L40 60 L140 60 L180 120 L220 120 L220 180 Z" fill="#0c122e" stroke="#c9a13d" stroke-width="2"/>
    <!-- Jhalar & Latkan styling motif on truck window -->
    <path d="M50 75 Q65 90 80 75 Q95 90 110 75 Q125 90 140 75" stroke="#ef4444" stroke-width="3" fill="none"/>
    <circle cx="65" cy="95" r="4" fill="#eab308"/>
    <circle cx="95" cy="95" r="4" fill="#eab308"/>
    <circle cx="125" cy="95" r="4" fill="#eab308"/>

    <!-- Sports Car Overlap -->
    <path d="M260 180 L290 130 L400 110 L480 140 L520 180 Z" fill="#141c42" stroke="#ffffff" stroke-width="2"/>
    <line x1="280" y1="160" x2="490" y2="160" stroke="#c9a13d" stroke-width="4"/>

    <!-- Wheels -->
    <circle cx="90" cy="180" r="30" fill="#050814" stroke="#c9a13d" stroke-width="3"/>
    <circle cx="170" cy="180" r="30" fill="#050814" stroke="#c9a13d" stroke-width="3"/>
    <circle cx="320" cy="180" r="26" fill="#050814" stroke="#ffffff" stroke-width="2"/>
    <circle cx="470" cy="180" r="26" fill="#050814" stroke="#ffffff" stroke-width="2"/>
  </g>

  <rect x="40" y="40" width="220" height="34" rx="6" fill="#0a0f24" stroke="#ef4444" stroke-width="1.5"/>
  <text x="150" y="62" font-family="'Barlow Condensed', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">CANADIAN CAR & TRUCK CULTURE</text>
  
  <text x="400" y="435" font-family="'Barlow Condensed', sans-serif" font-size="22" font-weight="900" fill="#c9a13d" text-anchor="middle" letter-spacing="2">ONTARIO TRENDS & HERITAGE INSPIRATION</text>
</svg>
