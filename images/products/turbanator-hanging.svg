<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#090d20"/>
  <!-- Rearview mirror hanging cord -->
  <line x1="300" y1="20" x2="300" y2="120" stroke="#c9a13d" stroke-width="3" stroke-dasharray="4 2"/>
  <!-- Turbanator Car Hanging Emblem -->
  <circle cx="300" cy="180" r="60" fill="#111736" stroke="#c9a13d" stroke-width="3"/>
  <!-- Stylized Turban Silhouette & Beard -->
  <path d="M260 180 C260 140 340 140 340 180 Z" fill="#eab308"/>
  <path d="M270 170 C280 150 320 150 330 170 Z" fill="#c9a13d"/>
  <circle cx="300" cy="190" r="16" fill="#131c3f"/>
  <!-- Sunglasses -->
  <rect x="280" y="185" width="16" height="8" rx="2" fill="#000000" stroke="#c9a13d"/>
  <rect x="304" y="185" width="16" height="8" rx="2" fill="#000000" stroke="#c9a13d"/>
  <!-- Bottom Tassel / Fringe -->
  <path d="M285 240 L315 240 L325 300 L275 300 Z" fill="#c9a13d" opacity="0.9"/>
  <text x="300" y="355" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">BEING TURBANATOR CAR HANGING</text>
</svg>
