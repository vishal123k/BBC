<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#090d20"/>
  <!-- Android Head Unit Screen Frame -->
  <rect x="120" y="80" width="360" height="230" rx="14" fill="#080b18" stroke="#c9a13d" stroke-width="3"/>
  <rect x="135" y="95" width="330" height="200" rx="8" fill="#131a38"/>
  <!-- Screen UI -->
  <g transform="translate(150, 110)">
    <text x="10" y="30" font-family="'Barlow Condensed', sans-serif" font-size="20" font-weight="700" fill="#ffffff">ANDROID AUTO / APPLE CARPLAY</text>
    <!-- App icons -->
    <rect x="10" y="55" width="45" height="45" rx="8" fill="#3b82f6"/>
    <rect x="65" y="55" width="45" height="45" rx="8" fill="#22c55e"/>
    <rect x="120" y="55" width="45" height="45" rx="8" fill="#ec4899"/>
    <rect x="175" y="55" width="45" height="45" rx="8" fill="#c9a13d"/>
    <!-- Navigation map snippet -->
    <rect x="10" y="115" width="280" height="60" rx="6" fill="#0b0f22" stroke="#1f294d"/>
    <path d="M20 155 L100 130 L180 160 L270 125" stroke="#38bdf8" stroke-width="3" fill="none"/>
    <circle cx="100" cy="130" r="5" fill="#c9a13d"/>
  </g>
  <text x="300" y="355" font-family="'Barlow Condensed', sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">HD IPS ANDROID TOUCH DISPLAY</text>
</svg>
