<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#080b18"/>
  <circle cx="300" cy="180" r="160" fill="url(#starGlow)" opacity="0.4"/>
  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="70" r="1.5" opacity="0.8"/>
    <circle cx="180" cy="90" r="2.5" opacity="0.9"/>
    <circle cx="230" cy="50" r="1.2" opacity="0.7"/>
    <circle cx="280" cy="120" r="3" fill="#c9a13d"/>
    <circle cx="340" cy="65" r="2" opacity="0.8"/>
    <circle cx="410" cy="110" r="2" opacity="0.9"/>
    <circle cx="470" cy="75" r="1.5" opacity="0.7"/>
    <circle cx="150" cy="160" r="2" opacity="0.6"/>
    <circle cx="210" cy="190" r="2.5" opacity="0.9"/>
    <circle cx="270" cy="170" r="1.8" opacity="0.8"/>
    <circle cx="360" cy="180" r="3" fill="#c9a13d"/>
    <circle cx="440" cy="160" r="2" opacity="0.8"/>
    <circle cx="130" cy="240" r="2" opacity="0.7"/>
    <circle cx="190" cy="270" r="1.5" opacity="0.8"/>
    <circle cx="320" cy="260" r="2.5" opacity="0.9"/>
    <circle cx="400" cy="250" r="1.5" opacity="0.6"/>
    <circle cx="480" cy="230" r="2.5" opacity="0.9"/>
  </g>
  <!-- Shooting Star trail -->
  <path d="M120 40 L310 140" stroke="url(#shootingTrail)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Headliner Roof Silhouette -->
  <path d="M80 340 C200 290 400 290 520 340 L540 370 L60 370 Z" fill="#131a38" stroke="#1e294f" stroke-width="2"/>
  <text x="300" y="360" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="700" fill="#c9a13d" text-anchor="middle" letter-spacing="2">STARLIGHT FIBER HEADLINER</text>
  <defs>
    <radialGradient id="starGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#c9a13d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080b18" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shootingTrail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9a13d" stop-opacity="1"/>
    </linearGradient>
  </defs>
</svg>
