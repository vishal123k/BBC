<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#090d20"/>
  <!-- Turbine Jet Nozzle Air Vents with RGB Backlight -->
  <g transform="translate(180, 80)">
    <!-- Outer Turbine Ring -->
    <circle cx="120" cy="120" r="100" fill="#111736" stroke="#c9a13d" stroke-width="4"/>
    <circle cx="120" cy="120" r="80" fill="#0a0d1e" stroke="#1f294f" stroke-width="2"/>
    <!-- Turbine Fins -->
    <g stroke="#c9a13d" stroke-width="3" stroke-linecap="round">
      <line x1="120" y1="45" x2="120" y2="85"/>
      <line x1="120" y1="155" x2="120" y2="195"/>
      <line x1="45" y1="120" x2="85" y2="120"/>
      <line x1="155" y1="120" x2="195" y2="120"/>
      <line x1="67" y1="67" x2="95" y2="95"/>
      <line x1="145" y1="145" x2="173" y2="173"/>
      <line x1="173" y1="67" x2="145" y2="95"/>
      <line x1="95" y1="145" x2="67" y2="173"/>
    </g>
    <!-- Center Hub -->
    <circle cx="120" cy="120" r="28" fill="#131c3f" stroke="#c9a13d" stroke-width="2.5"/>
    <circle cx="120" cy="120" r="12" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  </g>
  <text x="300" y="355" font-family="'Barlow Condensed', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">RGB TURBINE JET NOZZLE SET</text>
</svg>
