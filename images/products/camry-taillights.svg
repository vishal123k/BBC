  <path d="M100 160 L240 160 L280 200 L120 220 Z" fill="#180b12" stroke="#dc2626" stroke-width="3"/>
  <path d="M500 160 L360 160 L320 200 L480 220 Z" fill="#180b12" stroke="#dc2626" stroke-width="3"/>
  <path d="M110 170 L230 170 L260 200" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" filter="drop-shadow(0 0 10px #f43f5e)"/>
  <path d="M490 170 L370 170 L340 200" stroke="#f43f5e" stroke-width="5" stroke-linecap="round" filter="drop-shadow(0 0 10px #f43f5e)"/>
